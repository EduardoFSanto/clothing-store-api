services:
  postgres:
    image: postgres:17
    container_name: loja-roupa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
      POSTGRES_DB: loja_roupa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: